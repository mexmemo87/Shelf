<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 15px 20px;
      flex: 1;
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: #a0a0a0;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
    }

    .add-book-form {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
    }

    .form-group {
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      background: #121212;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #007acc;
    }

    button.btn-primary {
      padding: 0 25px;
      background: #007acc;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: #005999;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .book-card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .book-card:hover {
      transform: translateY(-2px);
      border-color: #404040;
    }

    .book-info h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .book-info p {
      font-size: 0.9rem;
      color: #888888;
    }

    .book-actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid #3a2223;
      color: #f44336;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-delete:hover {
      background: #2c1516;
      border-color: #f44336;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Shelf</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <h3>Total Books</h3>
        <p id="total-books">0</p>
      </div>
    </div>

    <form class="add-book-form" action="/add-book" method="POST">
      <div class="form-group">
        <input type="text" name="title" placeholder="Book Title" required autocomplete="off">
      </div>
      <div class="form-group">
        <input type="text" name="author" placeholder="Author" required autocomplete="off">
      </div>
      <button type="submit" class="btn-primary">Add Book</button>
    </form>

    <div class="book-grid" id="book-grid">
      <!-- Cards render dynamically via JavaScript -->
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('/api/books');
        const books = await response.json();

        // Update Stats
        document.getElementById('total-books').textContent = books.length;

        // Render Books
        const grid = document.getElementById('book-grid');
        grid.innerHTML = '';

        books.forEach(book => {
          const card = document.createElement('div');
          card.className = 'book-card';
          card.innerHTML = `
            <div class="book-info">
              <h3>${book.title}</h3>
              <p>by ${book.author}</p>
            </div>
            <div class="book-actions">
              <form action="/delete-book/${book.id}" method="POST">
                <button type="submit" class="btn-delete">Delete</button>
              </form>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
