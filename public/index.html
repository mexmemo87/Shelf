<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 950px; width: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 2.5rem; }

    .auth-card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 2rem;
      max-width: 400px;
      margin: 4rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .auth-card h2 { margin-bottom: 0.5rem; text-align: center; }
    .auth-card input {
      background-color: #121212;
      border: 1px solid #333;
      color: #fff;
      padding: 0.75rem;
      border-radius: 6px;
      outline: none;
    }
    .auth-card button {
      background-color: #0088ff;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-card button.secondary { background-color: #333; margin-top: 0.5rem; }

    /* METRICS DASHBOARD */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stats-card { background-color: #1e1e1e; border-radius: 8px; padding: 1.5rem; }
    .stats-card h2 { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 0.5rem; }
    .stats-card .number { font-size: 2.5rem; font-weight: bold; }

    .add-book-form {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-book-form input, .add-book-form select {
      background-color: #121212;
      border: 1px solid #333;
      color: #fff;
      padding: 0.75rem;
      border-radius: 6px;
      outline: none;
    }
    .add-book-form input[type="text"] { flex: 2; min-width: 150px; }
    .add-book-form select { flex: 1; min-width: 110px; }
    .btn { background-color: #0088ff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-logout { background-color: #333; padding: 0.5rem 1rem; font-size: 0.85rem; }

    /* GRID AND CARDS WITH COVERS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .card { 
      background-color: #1e1e1e; 
      border-radius: 8px; 
      overflow: hidden;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      border: 1px solid #2a2a2a;
    }
    .cover-container {
      width: 100%;
      height: 220px;
      background-color: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #2a2a2a;
    }
    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover-placeholder {
      color: #444;
      font-size: 3rem;
    }
    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card h3 { font-size: 1.1rem; line-height: 1.3; }
    .card p { color: #888; font-size: 0.85rem; }
    .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    
    .rating-select, .status-select {
      background-color: #121212;
      border: 1px solid #333;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .rating-select { color: #ffca28; }
    .status-select { color: #81c784; }

    .delete-btn { background: none; border: 1px solid #d32f2f; color: #ff6666; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; align-self: flex-end; font-size: 0.85rem; }
    .delete-btn:hover { background-color: #d32f2f; color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- AUTHENTICATION FORM -->
    <div id="auth-section" class="auth-card">
      <h2 id="auth-title">Sign In</h2>
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button id="auth-submit-btn" onclick="handleAuth()">Sign In</button>
      <button class="secondary" id="auth-toggle-btn" onclick="toggleAuthMode()">Need an account? Sign Up</button>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-section" class="hidden">
      <div class="header">
        <h1>Shelf</h1>
        <button class="btn btn-logout" onclick="logout()">Log Out</button>
      </div>

      <!-- TRIPLE METRICS DASHBOARD -->
      <div class="stats-container">
        <div class="stats-card">
          <h2>Total Books</h2>
          <div class="number" id="total-count">0</div>
        </div>
        <div class="stats-card">
          <h2>Read / Listened</h2>
          <div class="number" id="completed-count">0</div>
        </div>
        <div class="stats-card">
          <h2>To Read</h2>
          <div class="number" id="pending-count">0</div>
        </div>
      </div>

      <form class="add-book-form" action="/add-book" method="POST">
        <input type="text" name="title" placeholder="Book Title" required>
        <input type="text" name="author" placeholder="Author" required>
        <select name="rating">
          <option value="5">★ 5 Stars</option>
          <option value="4">★ 4 Stars</option>
          <option value="3">★ 3 Stars</option>
          <option value="2">★ 2 Stars</option>
          <option value="1">★ 1 Star</option>
        </select>
        <select name="status">
          <option value="To Read">To Read</option>
          <option value="Read">Read</option>
          <option value="Listened">Listened</option>
        </select>
        <button type="submit" class="btn">Add Book</button>
      </form>

      <div class="grid" id="books-grid"></div>
    </div>

  </div>

  <script>
    let authMode = 'login';

    function toggleAuthMode() {
      authMode = authMode === 'login' ? 'register' : 'login';
      document.getElementById('auth-title').textContent = authMode === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
      document.getElementById('auth-toggle-btn').textContent = authMode === 'login' 
        ? 'Need an account? Sign Up' 
        : 'Already have an account? Sign In';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) return alert('Please enter both email and password');

      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (res.ok) {
        checkSession();
      } else {
        alert(data.error || 'Authentication error');
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      checkSession();
    }

    async function checkSession() {
      const res = await fetch('/api/me');
      const data = await res.json();

      if (data.authenticated) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        fetchBooks();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
      }
    }

    async function updateBook(id, newRating, newStatus) {
      try {
        await fetch(`/update-book/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: newRating, status: newStatus })
        });
        fetchBooks();
      } catch (err) {
        console.error('Error updating book:', err);
      }
    }

    // FETCH COVER FROM GOOGLE BOOKS API
    async function fetchCoverUrl(title, author) {
      try {
        const query = encodeURIComponent(`${title} ${author}`);
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`);
        const data = await res.json();
        
        if (data.items && data.items[0]?.volumeInfo?.imageLinks) {
          const links = data.items[0].volumeInfo.imageLinks;
          let img = links.thumbnail || links.smallThumbnail;
          if (img) {
            return img.replace('http://', 'https://');
          }
        }
      } catch (err) {
        console.error('Error fetching Google cover:', err);
      }
      return null;
    }

    async function fetchBooks() {
      try {
        const response = await fetch('/api/books');
        if (!response.ok) return;
        const books = await response.json();

        // CALCULATE METRICS
        const total = books.length;
        const completed = books.filter(b => {
          const st = b.status || (b.read ? 'Read' : 'To Read');
          return st === 'Read' || st === 'Listened';
        }).length;
        const pending = total - completed;

        document.getElementById('total-count').textContent = total;
        document.getElementById('completed-count').textContent = completed;
        document.getElementById('pending-count').textContent = pending;

        const grid = document.getElementById('books-grid');
        grid.innerHTML = '';

        for (const book of books) {
          const currentStatus = book.status || (book.read ? 'Read' : 'To Read');
          const coverUrl = await fetchCoverUrl(book.title, book.author);

          const card = document.createElement('div');
          card.className = 'card';
          
          const coverHTML = coverUrl 
            ? `<div class="cover-container"><img src="${coverUrl}" alt="${book.title}" class="cover-image" /></div>`
            : `<div class="cover-container"><span class="cover-placeholder">📖</span></div>`;

          card.innerHTML = `
            ${coverHTML}
            <div class="card-content">
              <div>
                <h3>${book.title}</h3>
                <p>by ${book.author}</p>
              </div>
              <div class="meta">
                <select class="rating-select" onchange="updateBook(${book.id}, this.value, '${currentStatus}')">
                  <option value="5" ${book.rating === 5 ? 'selected' : ''}>★ 5</option>
                  <option value="4" ${book.rating === 4 ? 'selected' : ''}>★ 4</option>
                  <option value="3" ${book.rating === 3 ? 'selected' : ''}>★ 3</option>
                  <option value="2" ${book.rating === 2 ? 'selected' : ''}>★ 2</option>
                  <option value="1" ${book.rating === 1 ? 'selected' : ''}>★ 1</option>
                </select>
                <select class="status-select" onchange="updateBook(${book.id}, ${book.rating || 5}, this.value)">
                  <option value="To Read" ${currentStatus === 'To Read' ? 'selected' : ''}>To Read</option>
                  <option value="Read" ${currentStatus === 'Read' ? 'selected' : ''}>Read</option>
                  <option value="Listened" ${currentStatus === 'Listened' ? 'selected' : ''}>Listened</option>
                </select>
              </div>
              <form action="/delete-book/${book.id}" method="POST" style="margin-top: 0.5rem;">
                <button type="submit" class="delete-btn">Delete</button>
              </form>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) {
        console.error('Error loading books:', err);
      }
    }

    checkSession();
  </script>
</body>
</html>
