<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; }
    h1 { font-size: 2.5rem; margin-bottom: 2rem; }
    
    .stats-card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .stats-card h2 { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 0.5rem; }
    .stats-card .number { font-size: 2.5rem; font-weight: bold; }

    .add-book-form {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-book-form input, .add-book-form select {
      background-color: #121212;
      border: 1px solid #333;
      color: #fff;
      padding: 0.75rem;
      border-radius: 6px;
      outline: none;
    }
    .add-book-form input[type="text"] { flex: 2; min-width: 150px; }
    .add-book-form select { flex: 1; min-width: 100px; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; color: #ccc; font-size: 0.9rem; cursor: pointer; }
    .add-book-form button {
      background-color: #0088ff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .add-book-form button:hover { background-color: #0066cc; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }
    .card h3 { font-size: 1.2rem; }
    .card p { color: #888; font-size: 0.9rem; margin-top: 0.2rem; }
    .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    
    .rating-select {
      background-color: #121212;
      color: #ffca28;
      border: 1px solid #333;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; user-select: none; }
    .badge-read { background-color: #1b5e20; color: #81c784; }
    .badge-pending { background-color: #4a148c; color: #ce93d8; }
    
    .delete-btn {
      background: none;
      border: 1px solid #d32f2f;
      color: #ff6666;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-end;
      font-size: 0.85rem;
    }
    .delete-btn:hover { background-color: #d32f2f; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shelf</h1>

    <div class="stats-card">
      <h2>Total Books</h2>
      <div class="number" id="total-count">0</div>
    </div>

    <form class="add-book-form" action="/add-book" method="POST">
      <input type="text" name="title" placeholder="Book Title" required>
      <input type="text" name="author" placeholder="Author" required>
      <select name="rating">
        <option value="5">★ 5 Stars</option>
        <option value="4">★ 4 Stars</option>
        <option value="3">★ 3 Stars</option>
        <option value="2">★ 2 Stars</option>
        <option value="1">★ 1 Star</option>
      </select>
      <label class="checkbox-label">
        <input type="checkbox" name="read" checked> Read
      </label>
      <button type="submit">Add Book</button>
    </form>

    <div class="grid" id="books-grid"></div>
  </div>

  <script>
    async function updateBook(id, currentRating, currentReadState) {
      try {
        await fetch(`/update-book/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: currentRating, read: currentReadState })
        });
        fetchBooks();
      } catch (err) {
        console.error('Error updating book:', err);
      }
    }

    async function fetchBooks() {
      try {
        const response = await fetch('/api/books');
        const books = await response.json();

        document.getElementById('total-count').textContent = books.length;

        const grid = document.getElementById('books-grid');
        grid.innerHTML = '';

        books.forEach(book => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <h3>${book.title}</h3>
              <p>by ${book.author}</p>
              <div class="meta">
                <select class="rating-select" onchange="updateBook(${book.id}, this.value, ${book.read})">
                  <option value="5" ${book.rating === 5 ? 'selected' : ''}>★ 5</option>
                  <option value="4" ${book.rating === 4 ? 'selected' : ''}>★ 4</option>
                  <option value="3" ${book.rating === 3 ? 'selected' : ''}>★ 3</option>
                  <option value="2" ${book.rating === 2 ? 'selected' : ''}>★ 2</option>
                  <option value="1" ${book.rating === 1 ? 'selected' : ''}>★ 1</option>
                </select>
                <span class="badge ${book.read ? 'badge-read' : 'badge-pending'}" 
                      onclick="updateBook(${book.id}, ${book.rating || 5}, ${!book.read})">
                  ${book.read ? 'Read' : 'Pending'}
                </span>
              </div>
            </div>
            <form action="/delete-book/${book.id}" method="POST" style="margin-top: 1rem;">
              <button type="submit" class="delete-btn">Delete</button>
            </form>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading books:', err);
      }
    }

    fetchBooks();
  </script>
</body>
</html>
